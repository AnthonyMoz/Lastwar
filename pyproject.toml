[project]
name = "lastwar-farm"
version = "0.1.0"
description = "Client for the lastwar.farm (FarmOps) Public API v1"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
lastwar-farm = "lastwar_farm.__main__:main"

[tool.setuptools]
packages = ["lastwar_farm"]
